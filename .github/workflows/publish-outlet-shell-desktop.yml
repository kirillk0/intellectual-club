name: Publish Outlet Shell Desktop Windows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-outlet-shell-desktop.yml
      - native_tools/Cargo.lock
      - native_tools/Cargo.toml
      - native_tools/crates/outlet-core/**
      - native_tools/crates/outlet-shell/**
      - native_tools/crates/outlet-shell-desktop/**

permissions:
  contents: read

concurrency:
  group: publish-outlet-shell-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      release_id: ${{ steps.release.outputs.release_id }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_timestamp: ${{ steps.release.outputs.release_timestamp }}
      short_sha: ${{ steps.release.outputs.short_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          commit_sha="$(git rev-parse HEAD)"
          short_sha="${commit_sha:0:12}"
          commit_epoch="$(git show -s --format=%ct "${commit_sha}")"
          release_timestamp="$(date -u --date="@${commit_epoch}" '+%Y%m%dT%H%M%SZ')"
          release_id="${release_timestamp}-${short_sha}"
          release_tag="outlet-shell-desktop-${release_id}"

          {
            echo "commit_sha=${commit_sha}"
            echo "release_id=${release_id}"
            echo "release_tag=${release_tag}"
            echo "release_timestamp=${release_timestamp}"
            echo "short_sha=${short_sha}"
          } >>"${GITHUB_OUTPUT}"

  build:
    name: Build Windows x64
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 45

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native_tools -> target
          key: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --manifest-path native_tools/Cargo.toml --locked --release --package outlet-shell-desktop --target x86_64-pc-windows-msvc

      - name: Package Windows application
        shell: pwsh
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          $ErrorActionPreference = "Stop"

          $binary = Join-Path $PWD "native_tools\target\x86_64-pc-windows-msvc\release\outlet-shell-desktop.exe"
          $archive = Join-Path $PWD "dist\outlet-shell-desktop-$env:RELEASE_ID-windows-x64.zip"

          $bytes = [System.IO.File]::ReadAllBytes($binary)
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) {
            throw "Expected an x86_64 PE executable, found machine type 0x$($machine.ToString('x4'))"
          }

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Compress-Archive -LiteralPath $binary -DestinationPath $archive -CompressionLevel Optimal

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: outlet-shell-desktop-windows-x64
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download packaged application
        uses: actions/download-artifact@v4
        with:
          name: outlet-shell-desktop-windows-x64
          path: dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_TIMESTAMP: ${{ needs.prepare.outputs.release_timestamp }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          assets=(dist/*.zip)
          if [ "${#assets[@]}" -ne 1 ]; then
            echo "Expected one release archive, found ${#assets[@]}" >&2
            exit 1
          fi

          (
            cd dist
            sha256sum -- *.zip >SHA256SUMS.txt
          )

          tagged_sha="$(
            gh api "repos/${GH_REPO}/commits/${RELEASE_TAG}" --jq .sha 2>/dev/null
          )" || tagged_sha=""
          if [ -n "${tagged_sha}" ] && [ "${tagged_sha}" != "${COMMIT_SHA}" ]; then
            echo "Tag ${RELEASE_TAG} points to ${tagged_sha}, expected ${COMMIT_SHA}" >&2
            exit 1
          fi

          release_json="$(
            gh release view "${RELEASE_TAG}" --json assets,isDraft 2>/dev/null
          )" || release_json=""
          if [ -n "${release_json}" ]; then
            expected_assets=()
            for asset in "${assets[@]}"; do
              expected_assets+=("$(basename "${asset}")")
            done
            expected_assets+=("SHA256SUMS.txt")

            all_assets_present=true
            for expected_asset in "${expected_assets[@]}"; do
              if ! jq -e --arg name "${expected_asset}" \
                'any(.assets[]; .name == $name)' \
                <<<"${release_json}" >/dev/null; then
                all_assets_present=false
                break
              fi
            done

            is_draft="$(jq -r .isDraft <<<"${release_json}")"
            if [ "${all_assets_present}" = true ]; then
              if [ "${is_draft}" = true ]; then
                gh release edit "${RELEASE_TAG}" --draft=false
              fi
              echo "Release ${RELEASE_TAG} already contains all expected assets"
              exit 0
            fi

            gh release upload "${RELEASE_TAG}" \
              "${assets[@]}" dist/SHA256SUMS.txt \
              --clobber

            if [ "${is_draft}" = true ]; then
              gh release edit "${RELEASE_TAG}" --draft=false
            fi
          else
            tag_flag=(--target "${COMMIT_SHA}")
            if [ -n "${tagged_sha}" ]; then
              tag_flag=(--verify-tag)
            fi

            gh release create "${RELEASE_TAG}" \
              "${assets[@]}" dist/SHA256SUMS.txt \
              "${tag_flag[@]}" \
              --notes "Automated Windows x64 build from commit ${COMMIT_SHA}." \
              --title "Outlet Shell Desktop Windows ${RELEASE_TIMESTAMP} (${SHORT_SHA})"
          fi
