name: Publish Intellectual Club

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_desktop:
        description: Build and publish desktop packages
        type: boolean
        default: true
      build_app:
        description: Build and publish the app image
        type: boolean
        default: true
      build_shell_outlet:
        description: Build and publish the shell outlet image
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-intellectual-club-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/kirillk0/intellectual-club
  SHELL_OUTLET_IMAGE: ghcr.io/kirillk0/intellectual-club-shell-outlet

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
      shell_outlet: ${{ steps.filter.outputs.shell_outlet }}
      app_version: ${{ steps.release.outputs.app_version }}
      commit_epoch: ${{ steps.release.outputs.commit_epoch }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      outlet_version: ${{ steps.release.outputs.outlet_version }}
      release_id: ${{ steps.release.outputs.release_id }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_timestamp: ${{ steps.release.outputs.release_timestamp }}
      short_sha: ${{ steps.release.outputs.short_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          commit_sha="$(git rev-parse HEAD)"
          short_sha="${commit_sha:0:12}"
          commit_epoch="$(git show -s --format=%ct "${commit_sha}")"
          release_timestamp="$(date -u --date="@${commit_epoch}" '+%Y%m%dT%H%M%SZ')"
          release_id="${release_timestamp}-${short_sha}"
          release_tag="intellectual-club-${release_id}"
          app_version="$({
            sed -nE 's/^[[:space:]]*version: "([^"]+)",$/\1/p' server/mix.exs
          } | head -n 1)"
          outlet_version="$({
            sed -nE 's/^version = "([^"]+)"$/\1/p' \
              native_tools/crates/outlet-shell-desktop/Cargo.toml
          } | head -n 1)"

          if [ -z "${app_version}" ] || [ -z "${outlet_version}" ]; then
            echo "Could not read the application versions" >&2
            exit 1
          fi

          {
            echo "app_version=${app_version}"
            echo "commit_epoch=${commit_epoch}"
            echo "commit_sha=${commit_sha}"
            echo "outlet_version=${outlet_version}"
            echo "release_id=${release_id}"
            echo "release_tag=${release_tag}"
            echo "release_timestamp=${release_timestamp}"
            echo "short_sha=${short_sha}"
          } >>"${GITHUB_OUTPUT}"

      - name: Detect changed image inputs
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          INPUT_BUILD_APP: ${{ inputs.build_app }}
          INPUT_BUILD_SHELL_OUTLET: ${{ inputs.build_shell_outlet }}
        run: |
          set -euo pipefail

          app=false
          shell_outlet=false

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            app="${INPUT_BUILD_APP:-true}"
            shell_outlet="${INPUT_BUILD_SHELL_OUTLET:-true}"
          elif [ "${EVENT_NAME}" = "pull_request" ]; then
            app=false
            shell_outlet=false
          else
            zero_sha="0000000000000000000000000000000000000000"
            base="${BEFORE_SHA}"

            if [ -z "${base}" ] || [ "${base}" = "${zero_sha}" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              if git rev-parse "${AFTER_SHA}^" >/dev/null 2>&1; then
                base="$(git rev-parse "${AFTER_SHA}^")"
              else
                base="$(git rev-list --max-parents=0 "${AFTER_SHA}")"
              fi
            fi

            echo "Changed files between ${base} and ${AFTER_SHA}:"
            git diff --name-only "${base}" "${AFTER_SHA}" | tee /tmp/changed-files

            while IFS= read -r path; do
              case "${path}" in
                Dockerfile|.dockerignore|bin/static-assets.mjs|server/*|frontend/*|.github/workflows/publish-intellectual-club.yml)
                  app=true
                  ;;
              esac

              case "${path}" in
                .dockerignore|native_tools/*|.github/workflows/publish-intellectual-club.yml)
                  shell_outlet=true
                  ;;
              esac
            done </tmp/changed-files
          fi

          echo "app=${app}" >>"${GITHUB_OUTPUT}"
          echo "shell_outlet=${shell_outlet}" >>"${GITHUB_OUTPUT}"
          echo "app=${app}"
          echo "shell_outlet=${shell_outlet}"

  frontend:
    name: Test frontend and build shared static assets
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIX_ENV: prod

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test static artifact transfer
        run: node --test bin/tests/static-assets-test.mjs

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0"
          elixir-version: "1.20.2"

      - name: Cache production Mix dependencies
        uses: actions/cache@v4
        with:
          path: |
            server/deps
            server/_build
          key: Linux-X64-prod-mix-elixir-1.20.2-otp-29-${{ hashFiles('server/mix.lock') }}
          restore-keys: |
            Linux-X64-prod-mix-elixir-1.20.2-otp-29-

      - name: Build production static assets
        working-directory: server
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod
          mix compile
          mix assets.deploy

      - name: Export static assets for the release commit
        env:
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
        run: node bin/static-assets.mjs export build/ci-static "${COMMIT_SHA}"

      - name: Upload shared static assets
        uses: actions/upload-artifact@v4
        with:
          name: web-static-${{ needs.prepare.outputs.commit_sha }}
          path: build/ci-static/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  test-server:
    name: Run server tests on Linux
    runs-on: ubuntu-latest
    needs: prepare

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      IC_TEST_DATABASE_URL: ecto://postgres:postgres@localhost:5432/intellectual_club_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0"
          elixir-version: "1.20.2"

      - name: Cache Mix dependencies
        uses: actions/cache@v4
        with:
          path: |
            server/deps
            server/_build
          key: ${{ runner.os }}-mix-elixir-1.20.2-otp-29-${{ hashFiles('server/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-elixir-1.20.2-otp-29-

      - name: Install dependencies
        working-directory: server
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only test

      - name: Run tests
        working-directory: server
        # Partitions run in parallel on separate databases; --all includes the
        # whitebox tests that local runs exclude by default.
        run: ../bin/server-test --all

  build-macos:
    name: Build macOS arm64
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.build_desktop)
    needs: [prepare, frontend]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0"
          elixir-version: "1.20.2"

      - name: Cache Mix dependencies
        uses: actions/cache@v4
        with:
          path: |
            server/deps
            server/_build
          key: macos-arm64-prod-elixir-1.20.2-otp-29.0-${{ hashFiles('server/mix.lock') }}
          restore-keys: |
            macos-arm64-prod-elixir-1.20.2-otp-29.0-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native_tools -> target
          key: aarch64-apple-darwin-intellectual-club-macos

      - name: Install packaging dependencies
        run: brew install openssl@3

      - name: Download shared static assets
        uses: actions/download-artifact@v4
        with:
          name: web-static-${{ needs.prepare.outputs.commit_sha }}
          path: build/ci-static

      - name: Build application bundle
        env:
          IC_PREBUILT_STATIC_DIR: ${{ github.workspace }}/build/ci-static
          IC_BUNDLE_BUILD_ID: ${{ needs.prepare.outputs.release_id }}
          IC_BUNDLE_BUILD_VERSION: ${{ needs.prepare.outputs.commit_epoch }}
        run: ./bin/build-macos-app --mode prod --output build/release

      - name: Build native tools
        env:
          IC_BUNDLE_BUILD_ID: ${{ needs.prepare.outputs.release_id }}
          IC_BUNDLE_BUILD_VERSION: ${{ needs.prepare.outputs.commit_epoch }}
        run: ./bin/build-macos-native-tools --output build/release-native-tools

      - name: Ad-hoc sign release payloads
        shell: bash
        run: |
          set -euo pipefail

          codesign \
            --force \
            --sign - \
            --timestamp=none \
            "build/release-native-tools/openai-oauth"
          codesign \
            --force \
            --deep \
            --sign - \
            --timestamp=none \
            "build/release-native-tools/IC Shell Outlet.app"
          codesign \
            --force \
            --deep \
            --sign - \
            --timestamp=none \
            "build/release/Intellectual Club.app"

      - name: Validate application bundle
        shell: bash
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          OUTLET_VERSION: ${{ needs.prepare.outputs.outlet_version }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          app="build/release/Intellectual Club.app"
          launcher="${app}/Contents/MacOS/intellectual-club-launcher"
          release="${app}/Contents/Resources/intellectual_club"
          plist="${app}/Contents/Info.plist"
          beam=("${release}"/erts-*/bin/beam.smp)
          outlet_app="build/release-native-tools/IC Shell Outlet.app"
          outlet_executable="${outlet_app}/Contents/MacOS/outlet-shell-desktop"
          outlet_plist="${outlet_app}/Contents/Info.plist"
          oauth="build/release-native-tools/openai-oauth"

          test "$(uname -m)" = "arm64"
          test -x "${launcher}"
          test -x "${release}/bin/intellectual_club"
          test -x "${app}/Contents/Resources/postgresql/bin/postgres"
          test -f "${app}/Contents/Frameworks/libssl.3.dylib"
          test -f "${app}/Contents/Frameworks/libcrypto.3.dylib"
          test -s "${app}/Contents/Resources/AppIcon.icns"
          test -d "${app}/Contents/_CodeSignature"
          if [ "${#beam[@]}" -ne 1 ]; then
            echo "Expected one beam.smp binary, found ${#beam[@]}:" >&2
            printf '  %s\n' "${beam[@]}" >&2
            exit 1
          fi
          plutil -lint "${plist}"
          test "$(plutil -extract CFBundleIdentifier raw "${plist}")" = "org.intellectualclub.desktop"
          test "$(plutil -extract CFBundleShortVersionString raw "${plist}")" = "${APP_VERSION}"
          test "$(plutil -extract LSMinimumSystemVersion raw "${plist}")" = "15.0"
          test "$(lipo -archs "${launcher}")" = "arm64"
          test "$(lipo -archs "${beam[0]}")" = "arm64"
          test -x "${outlet_executable}"
          test -x "${oauth}"
          test -s "${outlet_app}/Contents/Resources/AppIcon.icns"
          test -d "${outlet_app}/Contents/_CodeSignature"
          plutil -lint "${outlet_plist}"
          test "$(plutil -extract CFBundleDisplayName raw "${outlet_plist}")" = "IC Shell Outlet"
          test "$(plutil -extract CFBundleIdentifier raw "${outlet_plist}")" = "org.intellectualclub.outlet-shell"
          test "$(plutil -extract CFBundleName raw "${outlet_plist}")" = "IC Shell Outlet"
          test "$(plutil -extract CFBundleShortVersionString raw "${outlet_plist}")" = "${OUTLET_VERSION}"
          test "$(plutil -extract LSMinimumSystemVersion raw "${outlet_plist}")" = "11.0"
          test "$(lipo -archs "${outlet_executable}")" = "arm64"
          test "$(lipo -archs "${oauth}")" = "arm64"

          codesign --verify --deep --strict --verbose=2 "${app}"
          codesign --verify --deep --strict --verbose=2 "${outlet_app}"
          codesign --verify --strict --verbose=2 "${oauth}"
          signature_info="$(codesign --display --verbose=4 "${app}" 2>&1)"
          grep -q '^Signature=adhoc$' <<<"${signature_info}"
          grep -q '^TeamIdentifier=not set$' <<<"${signature_info}"

          for payload in "${outlet_executable}" "${oauth}"; do
            signature_info="$(codesign --display --verbose=4 "${payload}" 2>&1)"
            grep -q '^Signature=adhoc$' <<<"${signature_info}"
            grep -q '^TeamIdentifier=not set$' <<<"${signature_info}"
            if otool -L "${payload}" | grep -q '/opt/homebrew/'; then
              echo "Homebrew dependency found in ${payload}" >&2
              exit 1
            fi
          done

          while IFS= read -r -d '' binary; do
            if file "${binary}" | grep -q 'Mach-O'; then
              test "$(lipo -archs "${binary}")" = "arm64"
              if otool -L "${binary}" | grep -q '/opt/homebrew/'; then
                echo "Homebrew dependency found in ${binary}" >&2
                exit 1
              fi
            fi
          done < <(
            find "${app}/Contents" -type f \
              \( -perm -111 -o -name '*.so' -o -name '*.dylib' \) \
              -print0
          )

      - name: Smoke test bundled release
        shell: bash
        run: |
          set -euo pipefail

          app="${PWD}/build/release/Intellectual Club.app"
          launcher="${app}/Contents/MacOS/intellectual-club-launcher"
          release="${app}/Contents/Resources/intellectual_club"
          export HOME="${RUNNER_TEMP}/intellectual-club-smoke-home"
          mkdir -p "${HOME}"

          cleanup() {
            exit_code=$?
            if [ "${exit_code}" -ne 0 ]; then
              "${launcher}" logs || true
            fi
            "${launcher}" stop || true
          }
          trap cleanup EXIT

          "${launcher}" start
          status_json="$("${launcher}" status --json)"
          jq -e --arg app_dir "${release}" \
            '.running and .app.healthy and .postgres.healthy and .paths.app_dir == $app_dir' \
            <<<"${status_json}"
          curl --fail --silent --show-error http://127.0.0.1:4000/health >/dev/null
          "${launcher}" stop
          trap - EXIT

      - name: Package release disk images
        shell: bash
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          set -euo pipefail

          mkdir -p dist
          full_image="dist/intellectual-club-${RELEASE_ID}-macos-arm64.dmg"
          native_tools_image="dist/intellectual-club-native-tools-${RELEASE_ID}-macos-arm64.dmg"

          ./bin/build-macos-dmg \
            --app "build/release-native-tools/IC Shell Outlet.app" \
            --binary "build/release-native-tools/openai-oauth" \
            --volume-name "Intellectual Club Native Tools" \
            --output "${native_tools_image}"
          ./bin/build-macos-dmg \
            --app "build/release/Intellectual Club.app" \
            --app "build/release-native-tools/IC Shell Outlet.app" \
            --binary "build/release-native-tools/openai-oauth" \
            --volume-name "Intellectual Club" \
            --output "${full_image}"

          device=""

          cleanup() {
            if [ -n "${device}" ]; then
              hdiutil detach "${device}" || true
            fi
          }
          trap cleanup EXIT

          validate_image() {
            local image="$1"
            local mount_dir="$2"
            local includes_full_app="$3"
            local attach_output
            local actual_items
            local expected_items

            rm -rf "${mount_dir}"
            mkdir -p "${mount_dir}"
            attach_output="$(
              hdiutil attach \
                -readonly \
                -noverify \
                -nobrowse \
                -mountpoint "${mount_dir}" \
                "${image}"
            )"
            device="$(awk 'NF >= 3 { device = $1 } END { print device }' <<<"${attach_output}")"

            test -n "${device}"
            if [ "${includes_full_app}" = true ]; then
              expected_items=$'Applications\nFirst Launch.txt\nIC Shell Outlet.app\nIntellectual Club.app\nopenai-oauth'
            else
              expected_items=$'Applications\nFirst Launch.txt\nIC Shell Outlet.app\nopenai-oauth'
            fi
            actual_items="$(LC_ALL=C ls -1 "${mount_dir}")"
            test "${actual_items}" = "${expected_items}"
            test -x "${mount_dir}/IC Shell Outlet.app/Contents/MacOS/outlet-shell-desktop"
            test -x "${mount_dir}/openai-oauth"
            test "$(readlink "${mount_dir}/Applications")" = /Applications
            grep -q 'Privacy & Security' "${mount_dir}/First Launch.txt"
            grep -q 'openai-oauth' "${mount_dir}/First Launch.txt"
            if grep -q 'УСТАНОВКА\|Перетащите\|Терминальные утилиты' \
              "${mount_dir}/First Launch.txt"; then
              echo "First Launch.txt must contain English instructions only" >&2
              exit 1
            fi
            plutil -lint "${mount_dir}/IC Shell Outlet.app/Contents/Info.plist"
            codesign --verify --deep --strict --verbose=2 "${mount_dir}/IC Shell Outlet.app"
            codesign --verify --strict --verbose=2 "${mount_dir}/openai-oauth"

            if [ "${includes_full_app}" = true ]; then
              test -x "${mount_dir}/Intellectual Club.app/Contents/MacOS/intellectual-club-launcher"
              test -x "${mount_dir}/Intellectual Club.app/Contents/Resources/intellectual_club/bin/intellectual_club"
              plutil -lint "${mount_dir}/Intellectual Club.app/Contents/Info.plist"
              codesign --verify --deep --strict --verbose=2 "${mount_dir}/Intellectual Club.app"
            else
              test ! -e "${mount_dir}/Intellectual Club.app"
            fi

            hdiutil detach "${device}"
            device=""
          }

          validate_image \
            "${native_tools_image}" \
            "${RUNNER_TEMP}/intellectual-club-native-tools-dmg" \
            false
          validate_image \
            "${full_image}" \
            "${RUNNER_TEMP}/intellectual-club-full-dmg" \
            true
          trap - EXIT

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: intellectual-club-macos-${{ needs.prepare.outputs.release_id }}
          path: dist/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-windows:
    name: Build and smoke test Windows x64
    if: github.event_name != 'workflow_dispatch' || inputs.build_desktop
    needs: [prepare, frontend]
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: 29.0
          elixir-version: 1.20.2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native_tools -> target
          key: intellectual-club-windows-x64-static-crt

      - name: Cache Mix dependencies
        uses: actions/cache@v4
        with:
          path: |
            server/deps
            server/_build
            build/windows/dependencies/rustler-precompiled-cache
          key: windows-x64-elixir-1.20.2-otp-29.0-${{ hashFiles('server/mix.lock') }}
          restore-keys: |
            windows-x64-elixir-1.20.2-otp-29.0-

      - name: Test packaging contract
        shell: pwsh
        run: ./bin/tests/build-windows-release-test.ps1

      - name: Download shared static assets
        uses: actions/download-artifact@v4
        with:
          name: web-static-${{ needs.prepare.outputs.commit_sha }}
          path: build/ci-static

      - name: Build, test, validate, and package
        shell: pwsh
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          ./bin/build-windows-release.ps1 `
            -ReleaseId $env:RELEASE_ID `
            -PrebuiltStaticDirectory "build/ci-static" `
            -OutputDirectory "dist\windows\$env:RELEASE_ID"

      - name: Upload four release assets
        uses: actions/upload-artifact@v4
        with:
          name: intellectual-club-windows-${{ needs.prepare.outputs.release_id }}
          path: dist/windows/${{ needs.prepare.outputs.release_id }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs:
      - prepare
      - build-macos
      - build-windows
      - test-server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download macOS release assets
        uses: actions/download-artifact@v4
        with:
          name: intellectual-club-macos-${{ needs.prepare.outputs.release_id }}
          path: dist

      - name: Download Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: intellectual-club-windows-${{ needs.prepare.outputs.release_id }}
          path: dist

      - name: Validate and publish combined release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_TIMESTAMP: ${{ needs.prepare.outputs.release_timestamp }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          set -euo pipefail

          expected=(
            "intellectual-club-${RELEASE_ID}-macos-arm64.dmg"
            "intellectual-club-native-tools-${RELEASE_ID}-macos-arm64.dmg"
            "outlet-shell-desktop-${RELEASE_ID}-windows-x64.exe"
            "openai-oauth-${RELEASE_ID}-windows-x64.exe"
            "intellectual-club-${RELEASE_ID}-windows-x64.zip"
            "SHA256SUMS.txt"
          )
          actual="$(find dist -maxdepth 1 -type f -exec basename {} \; | sort)"
          sorted_expected="$(printf '%s\n' "${expected[@]}" | sort)"
          if [ "${actual}" != "${sorted_expected}" ]; then
            echo "Expected exactly six release assets for macOS and Windows" >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "${sorted_expected}" "${actual}" >&2
            exit 1
          fi

          (
            cd dist
            sha256sum --check SHA256SUMS.txt
            sha256sum -- *.dmg *.exe *.zip >SHA256SUMS.txt
          )

          tagged_sha="$(gh api "repos/${GH_REPO}/commits/${RELEASE_TAG}" --jq .sha 2>/dev/null)" || tagged_sha=""
          if [ -n "${tagged_sha}" ] && [ "${tagged_sha}" != "${COMMIT_SHA}" ]; then
            echo "Tag ${RELEASE_TAG} points to ${tagged_sha}, expected ${COMMIT_SHA}" >&2
            exit 1
          fi

          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            tag_flag=(--target "${COMMIT_SHA}")
            if [ -n "${tagged_sha}" ]; then tag_flag=(--verify-tag); fi
            gh release create "${RELEASE_TAG}" \
              "${tag_flag[@]}" \
              --draft \
              --title "Intellectual Club ${RELEASE_TIMESTAMP} (${SHORT_SHA})" \
              --notes "Automated build from commit ${COMMIT_SHA}. Includes ad-hoc-signed, non-notarized macOS Apple Silicon disk images and unsigned portable Windows 11 x64 binaries. Verify downloads with SHA256SUMS.txt."
          fi

          gh release upload "${RELEASE_TAG}" dist/* --clobber
          gh release edit "${RELEASE_TAG}" --draft=false

  build-app:
    name: Build app ${{ matrix.platform_key }}
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    needs:
      - prepare
      - test-server
      - frontend
    if: github.event_name != 'pull_request' && needs.prepare.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_key: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            platform_key: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Download shared static assets
        uses: actions/download-artifact@v4
        with:
          name: web-static-${{ needs.prepare.outputs.commit_sha }}
          path: build/ci-static

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.APP_IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-contexts: |
            web-static=./build/ci-static
          build-args: |
            STATIC_ASSETS=prebuilt
            BUILD_COMMIT_SHA=${{ needs.prepare.outputs.commit_sha }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.APP_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=app-${{ matrix.platform_key }}
          cache-to: type=gha,scope=app-${{ matrix.platform_key }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/app
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/app/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-app-${{ matrix.platform_key }}
          path: /tmp/digests/app/*
          if-no-files-found: error
          retention-days: 1

  publish-app:
    name: Publish app manifest
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-app
    if: github.event_name != 'pull_request' && needs.prepare.outputs.app == 'true'

    steps:
      - name: Download app digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-app-*
          path: /tmp/digests/app
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        env:
          PUSH_MAIN_TAG: ${{ github.ref == 'refs/heads/main' }}
          IMAGE: ${{ env.APP_IMAGE }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          tags=("-t" "${IMAGE}:sha-${GITHUB_SHA}")
          if [ "${PUSH_MAIN_TAG}" = "true" ]; then
            tags+=("-t" "${IMAGE}:main")
            tags+=("-t" "${IMAGE}:latest")
          fi

          refs=()
          for digest_file in /tmp/digests/app/*; do
            refs+=("${IMAGE}@sha256:$(basename "${digest_file}")")
          done

          if [ "${#refs[@]}" -ne 2 ]; then
            echo "Expected 2 digests for ${IMAGE}, got ${#refs[@]}" >&2
            exit 1
          fi

          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

  build-shell-outlet:
    name: Build shell outlet ${{ matrix.platform_key }}
    permissions:
      contents: read
