[Journal]
Storage=persistent
Compress=yes
# Rotate hourly so age-based cleanup has approximately hourly granularity.
MaxFileSec=1h
MaxRetentionSec=10day
# Size/free-space limits take precedence over the ten-day retention window.
SystemMaxUse=1G
SystemKeepFree=2G
SystemMaxFileSize=1M
SystemMaxFiles=1024
# Do not silently discard application bursts through journald rate limiting.
RateLimitIntervalSec=0
ReadKMsg=no
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToConsole=no
ForwardToWall=no
